<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台股法人與融資融券</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#5f6773;--line:#e2e5ea;--up:#d32f2f;--dn:#0b8a4a;--warn:#fff1d6;--warnx:#7a4b00;--btn:#e8ecf3;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--tx:#eceff3;--mut:#a3aab5;--line:#2d343e;--up:#ff6b61;--dn:#42dc8b;--warn:#3b2f12;--warnx:#f3c66f;--btn:#2a313b}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:14px 12px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;margin:6px 0 10px}h2{font-size:20px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sub{color:var(--mut);font-size:15px;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.item{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.item .n{font-size:15px;color:var(--mut)}
.big{font-size:30px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.mid{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--mut)}
.warn{background:var(--warn);color:var(--warnx);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:16px}
.tag{font-size:13px;background:var(--line);color:var(--mut);border-radius:99px;padding:1px 9px;margin-left:6px;vertical-align:3px;white-space:nowrap}
.nav{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;margin:10px 0 4px}
.nav button,.nav input{min-height:46px;font:inherit;font-size:17px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--tx);padding:6px 4px;width:100%;min-width:0}
.nav button{cursor:pointer;font-weight:600}
.nav button:disabled{opacity:.35;cursor:default}
.nav input{background:var(--card);text-align:center}
.link{background:none;border:0;color:#3b82f6;font:inherit;font-size:16px;padding:6px 0;cursor:pointer;text-decoration:underline}
.note{background:var(--warn);color:var(--warnx);border-radius:8px;padding:6px 10px;font-size:15px;margin:6px 0}
details{margin-top:12px}summary{cursor:pointer;color:var(--mut);font-size:16px;padding:6px 0}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:15px}
table.wide{min-width:520px}
th,td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.hint{color:var(--mut);font-size:13px}
.foot{color:var(--mut);font-size:14px;margin-top:16px}
@media (max-width:520px){
  body{font-size:17px}
  main{padding-left:10px;padding-right:10px}
  h1{font-size:22px}
  .card{padding:14px 12px}
  .grid{grid-template-columns:1fr}
  .big{font-size:28px}
  table{font-size:13.5px}th,td{padding:6px 2px}
  .nav{grid-template-columns:1fr 1fr}
  .nav input{grid-column:1 / 3;grid-row:1}
}
</style>
</head>
<body>
<main>
<h1>台股法人與融資融券</h1>
<div id="msg" class="sub">資料載入中…</div>
<div id="app" style="display:none">
  <div id="warn"></div>
  <div id="cardI" class="card"></div>
  <div id="cardM" class="card"></div>
</div>
<p class="foot">資料來源：臺灣證券交易所（上市）。金額單位為億元。紅色＝增加／買超，綠色＝減少／賣超。「前一日」「後一日」是指前一個、後一個有開市的交易日。資料僅供參考，不是投資建議。<br>原始資料：<a href="https://www.twse.com.tw/zh/trading/foreign/bfi82u.html">三大法人</a>、<a href="https://www.twse.com.tw/zh/trading/margin/mi-margn.html">融資融券</a></p>
</main>
<script>
(function(){
var I=null,M=null,st={i:0,m:0},note={i:"",m:""},opened={i:false,m:false};
var N={dealerOwn:"自營商（自行買賣）",dealerHedge:"自營商（避險）",trust:"投信",foreign:"外資"};
var WD=["日","一","二","三","四","五","六"];
function f(n){return Math.abs(n).toLocaleString("en-US")}
function yi(n,sign){var a=Math.abs(n)/1e8,s=n<0?"-":(sign&&n>0?"+":"");return s+a.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+"億"}
function c(n){return n>0?"up":(n<0?"dn":"fl")}
function net(r){return r[0]-r[1]}
function dealer(d){var a=d.rows.dealerOwn,b=d.rows.dealerHedge;return [a[0]+b[0],a[1]+b[1]]}
function total(d){var t=[0,0];["dealerOwn","dealerHedge","trust","foreign"].forEach(function(k){t[0]+=d.rows[k][0];t[1]+=d.rows[k][1]});return t}
function twToday(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei"}).format(new Date())}
function age(date){return Math.round((new Date(twToday())-new Date(date))/864e5)}
function wd(date){return "（週"+WD[new Date(date+"T00:00:00").getDay()]+"）"}
function stamp(s){return s?s.replace("T"," ").slice(0,16):""}
function sw(label,n){return '<div class="item"><div class="n">'+label+'</div><div class="big '+c(n)+'">'+(n>0?"買超 ":(n<0?"賣超 ":""))+yi(Math.abs(n))+'</div></div>'}
function chg(label,v,yuan){return '<div class="item"><div class="n">'+label+'</div><div class="mid '+c(v)+'">'+(v>0?"增加 ":(v<0?"減少 ":"持平 "))+(yuan?yi(Math.abs(v)):f(v)+" 張")+'</div></div>'}
function nav(card,days){
  var idx=st[card],cur=days[idx];
  return '<div class="nav"><button data-card="'+card+'" data-act="prev"'+(idx>=days.length-1?' disabled':'')+'>◀ 前一日</button>'
    +'<input type="date" data-card="'+card+'" value="'+cur.date+'" min="'+days[days.length-1].date+'" max="'+days[0].date+'" aria-label="選擇日期">'
    +'<button data-card="'+card+'" data-act="next"'+(idx<=0?' disabled':'')+'>後一日 ▶</button></div>'
    +(idx>0?'<button class="link" data-card="'+card+'" data-act="latest">回到最新一天</button>':'')
    +(note[card]?'<div class="note">'+note[card]+'</div>':'')}
function renderI(){
  var days=I.days,idx=st.i,d=days[idx],p=days[idx+1],today=twToday(),t=total(d),h="";
  h+='<h2>三大法人買賣超'+(idx===0&&d.date!==today?'<span class="tag">今天尚未公布</span>':'')+'</h2>'+nav("i",days);
  h+='<div class="sub">資料日期：'+d.date+wd(d.date)+(idx===0?'　更新：'+stamp(I.updated):'')+'</div><div class="grid">'
    +sw("外資",net(d.rows.foreign))+sw("投信",net(d.rows.trust))+sw("自營商",net(dealer(d)))+sw("三大法人合計",net(t))+'</div>';
  if(p){var pt=total(p);h+='<p class="sub">合計較前一交易日（'+p.date+'）：<span class="'+c(net(t)-net(pt))+'">'+yi(net(t)-net(pt),true)+'</span></p>'}
  else h+='<p class="sub">這是最早的一筆資料，沒有前一日可比較。</p>';
  var run=0,dir=Math.sign(net(d.rows.foreign)),k;
  if(dir)for(k=idx;k<days.length;k++){if(Math.sign(net(days[k].rows.foreign))===dir)run++;else break}
  var s5=0,n5=Math.min(5,days.length-idx);for(k=idx;k<idx+n5;k++)s5+=net(days[k].rows.foreign);
  h+='<p class="sub">外資'+(dir?'連續'+(dir>0?'買超':'賣超')+' <b>'+run+'</b> 天':'持平')+'；近 '+n5+' 天累計 <span class="'+c(s5)+'">'+yi(s5,true)+'</span></p>';
  h+='<details data-card="i"'+(opened.i?' open':'')+'><summary>看明細（買進／賣出）</summary><div class="sc"><table><tr><th>單位</th><th>買進</th><th>賣出</th><th>差額</th></tr>';
  ["dealerOwn","dealerHedge","trust","foreign"].forEach(function(k){var r=d.rows[k];h+='<tr><td>'+N[k]+'</td><td>'+yi(r[0])+'</td><td>'+yi(r[1])+'</td><td class="'+c(net(r))+'">'+yi(net(r),true)+'</td></tr>'});
  h+='<tr><td><b>合計</b></td><td>'+yi(t[0])+'</td><td>'+yi(t[1])+'</td><td class="'+c(net(t))+'">'+yi(net(t),true)+'</td></tr></table></div>';
  h+='<div class="sc"><table><tr><th>日期</th><th>外資</th><th>投信</th><th>自營商</th><th>合計</th></tr>';
  days.slice(idx,idx+10).forEach(function(x){h+='<tr><td>'+x.date.slice(5)+'</td><td class="'+c(net(x.rows.foreign))+'">'+yi(net(x.rows.foreign),true)+'</td><td class="'+c(net(x.rows.trust))+'">'+yi(net(x.rows.trust),true)+'</td><td class="'+c(net(dealer(x)))+'">'+yi(net(dealer(x)),true)+'</td><td class="'+c(net(total(x)))+'">'+yi(net(total(x)),true)+'</td></tr>'});
  h+='</table></div></details>';
  document.getElementById("cardI").innerHTML=h}
function renderM(){
  var days=M.days,idx=st.m,d=days[idx],today=twToday(),mg=d.margin,sh=d.short,am=d.amount,ratio=mg.today?sh.today/mg.today*100:0,h="";
  h+='<h2>融資融券'+(idx===0&&d.date!==today?'<span class="tag">今天尚未公布</span>':'')+(d.final?'':'<span class="tag">當日暫定，隔天校正</span>')+'</h2>'+nav("m",days);
  h+='<div class="sub">資料日期：'+d.date+wd(d.date)+(idx===0?'　更新：'+stamp(M.updated):'')+'</div><div class="grid">'
    +'<div class="item"><div class="n">融資餘額</div><div class="big">'+yi(am.today*1000)+'</div><div class="sub">'+f(mg.today)+' 張</div></div>'
    +'<div class="item"><div class="n">融券餘額</div><div class="big">'+f(sh.today)+' 張</div></div>'
    +chg("融資金額較前日",(am.today-am.prev)*1000,true)
    +chg("融券張數較前日",sh.today-sh.prev,false)+'</div>'
    +'<p class="sub">融資張數較前日：<span class="'+c(mg.today-mg.prev)+'">'+(mg.today-mg.prev>0?"+":(mg.today-mg.prev<0?"-":""))+f(mg.today-mg.prev)+' 張</span>　券資比：'+ratio.toFixed(2)+'%</p>';
  h+='<details data-card="m"'+(opened.m?' open':'')+'><summary>看明細（買進／賣出／還款）</summary><div class="hint">表格太寬時可左右滑動</div><div class="sc"><table class="wide"><tr><th>項目</th><th>買進</th><th>賣出</th><th>償還</th><th>前日餘額</th><th>今日餘額</th></tr>'
    +'<tr><td>融資（張）</td><td>'+f(mg.buy)+'</td><td>'+f(mg.sell)+'</td><td>'+f(mg.repay)+'</td><td>'+f(mg.prev)+'</td><td>'+f(mg.today)+'</td></tr>'
    +'<tr><td>融券（張）</td><td>'+f(sh.buy)+'</td><td>'+f(sh.sell)+'</td><td>'+f(sh.repay)+'</td><td>'+f(sh.prev)+'</td><td>'+f(sh.today)+'</td></tr></table></div></details>';
  document.getElementById("cardM").innerHTML=h}
function renderAll(){renderI();renderM()}
function pick(card,date){
  var days=(card==="i"?I:M).days,i,hit=-1;
  for(i=0;i<days.length;i++){if(days[i].date===date){hit=i;break}}
  if(hit<0){for(i=0;i<days.length;i++){if(days[i].date<date){hit=i;break}}
    if(hit<0)hit=days.length-1;
    note[card]="你選的 "+date+" 沒有資料（可能休市或不在範圍內），已顯示最接近的交易日 "+days[hit].date+"。"}
  else note[card]="";
  st[card]=hit}
var app=document.getElementById("app");
app.addEventListener("click",function(e){
  var b=e.target.closest("button[data-act]");if(!b||b.disabled)return;
  var card=b.getAttribute("data-card"),act=b.getAttribute("data-act"),days=(card==="i"?I:M).days;
  note[card]="";
  if(act==="prev"&&st[card]<days.length-1)st[card]++;
  else if(act==="next"&&st[card]>0)st[card]--;
  else if(act==="latest")st[card]=0;
  card==="i"?renderI():renderM()});
app.addEventListener("change",function(e){
  var el=e.target;if(el.tagName!=="INPUT"||!el.value)return;
  var card=el.getAttribute("data-card");pick(card,el.value);card==="i"?renderI():renderM()});
app.addEventListener("toggle",function(e){var t=e.target;if(t.tagName==="DETAILS")opened[t.getAttribute("data-card")]=t.open},true);
function load(u){return fetch(u+"?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()})}
Promise.all([load("data/institutional.json"),load("data/margin.json")]).then(function(a){
  I=a[0];M=a[1];
  if(!I.days.length||!M.days.length){document.getElementById("msg").textContent="目前沒有資料。";return}
  if(age(I.days[0].date)>4||age(M.days[0].date)>4)document.getElementById("warn").innerHTML='<div class="warn">⚠ 資料可能已停止更新（最新日期：三大法人 '+I.days[0].date+'、融資融券 '+M.days[0].date+'），請以證交所網站為準。</div>';
  document.getElementById("msg").style.display="none";app.style.display="";renderAll()
}).catch(function(){document.getElementById("msg").textContent="資料讀取失敗，請稍後再試。"});
})();
</script>
</body>
</html>

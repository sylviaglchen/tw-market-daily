name: update-data
on:
  schedule:
    - cron: '*/10 7-8 * * 1-5'
    - cron: '*/10 12-14 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '回補幾天（第一次填 90，平常留 0）'
        default: '0'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch data
        run: python scripts/fetch.py
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
      - name: Save changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "update data" && git push)

name: update-data
on:
  schedule:
    - cron: '*/10 7-8 * * 1-5'
    - cron: '*/10 12-14 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '回補幾天（第一次填 90，平常留 0）'
        default: '0'
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch data
        run: python scripts/fetch.py
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
      - name: Save changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "update data"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "retry $i"
            sleep 5
          done
          exit 1
